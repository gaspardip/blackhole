[package]
name = "blackhole-check"
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
description = "Rules that coding agents cannot talk their way around."
license = "MIT"
repository = "https://github.com/gaspardip/blackhole"

[[bin]]
name = "blackhole"
path = "src/main.rs"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
