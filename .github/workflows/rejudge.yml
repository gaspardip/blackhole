name: rejudge

# This file is read from the default branch, so a pull request cannot change what a review sets off.
on:
  workflow_run:
    workflows: [review]
    types: [completed]

permissions:
  actions: write

jobs:
  rejudge:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: rerun the judge
        run: |
          set -eu
          run="$(gh api -X GET "repos/${GITHUB_REPOSITORY}/actions/workflows/judge.yml/runs" \
            -f head_sha="${HEAD_SHA}" -f event=pull_request_target -f per_page=1 --jq '.workflow_runs[0].id // empty')"
          if [ -z "${run}" ]; then
            echo "rejudge: no judge run for ${HEAD_SHA}"
            exit 1
          fi
          # A run still going may have read the reviews before this one arrived, and cannot be rerun until it ends.
          gh run watch "${run}" --repo "${GITHUB_REPOSITORY}" > /dev/null
          # A rerun keeps the workflow file and the commit of the first run, and reads the reviews again.
          gh run rerun "${run}" --repo "${GITHUB_REPOSITORY}"
