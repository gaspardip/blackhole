name: packaging

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/packaging.yml'
      - 'tools/stage_npm.py'
      - 'tools/test_distribution.py'
      - 'tools/smoke_npm.sh'
      - 'npm/**'
      - 'Cargo.*'
      - 'rust-toolchain.toml'
      - 'README.md'
      - 'LICENSE'
      - 'THIRD_PARTY_NOTICES.md'

permissions: {}

jobs:
  build:
    strategy: &targets
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-22.04, triple: x86_64-unknown-linux-gnu, platform: linux-x64}
          - {runner: ubuntu-22.04-arm, triple: aarch64-unknown-linux-gnu, platform: linux-arm64}
          - {runner: macos-15-intel, triple: x86_64-apple-darwin, platform: darwin-x64}
          - {runner: macos-15, triple: aarch64-apple-darwin, platform: darwin-arm64}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - &fetch
        name: Fetch source
        run: |
          git init -q .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git fetch -q --depth 1 origin "${GITHUB_SHA}"
          git checkout -q FETCH_HEAD
      - name: Build native binary
        env:
          TARGET: ${{ matrix.triple }}
        run: |
          rustc -vV | grep -Fx "host: $TARGET"
          cargo build --release --locked --target "$TARGET"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ matrix.triple }}
          path: target/${{ matrix.triple }}/release/blackhole
          if-no-files-found: error

  package:
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    outputs:
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - *fetch
      - &node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          token: ''
      - &pnpm
        uses: pnpm/action-setup@v6.1.1
        with:
          version: 12.16.1
      - name: Verify crate
        run: cargo package --locked
      - uses: actions/download-artifact@v8.0.2
        with:
          path: target/native
          pattern: '*-*-*'
      - name: Assemble release archives
        id: metadata
        run: |
          for dir in target/native/*; do
            mkdir "$dir/release"
            mv "$dir/blackhole" "$dir/release/"
          done
          python3 tools/stage_npm.py target/native target/npm-package
          node -p '"version=" + require("./target/npm-package/package.json").version' >> "$GITHUB_OUTPUT"
          mkdir target/dist
          pnpm --dir target/npm-package pack --pack-destination "$PWD/target/dist"
          cp target/package/*.crate target/dist/
          cd target/dist
          sha256sum *.crate *.tgz > SHA256SUMS
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: distribution-${{ github.sha }}
          path: target/dist/
          if-no-files-found: error

  smoke:
    needs: package
    strategy: *targets
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - *fetch
      - *node
      - *pnpm
      - uses: actions/download-artifact@v8.0.2
        with:
          name: distribution-${{ github.sha }}
          path: dist
      - name: Verify and install the tested archive
        env:
          PLATFORM: ${{ matrix.platform }}
          VERSION: ${{ needs.package.outputs.version }}
        run: |
          (cd dist && shasum -a 256 -c SHA256SUMS)
          sh tools/smoke_npm.sh "$PWD"/dist/*.tgz "$PLATFORM" "$VERSION"
