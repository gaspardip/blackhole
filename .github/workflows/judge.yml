name: blackhole judge

on:
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize, edited]

permissions: {}

defaults:
  run:
    shell: bash

env:
  PR_NUMBER: ${{ github.event.pull_request.number }}
  PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
  PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}

jobs:
  judge:
    if: >-
      github.repository == 'gaspardip/blackhole' &&
      (github.event.action != 'edited' || github.event.changes.base)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions: {}
    outputs:
      conclusion: ${{ steps.verdict.outputs.conclusion }}
    steps:
      - name: Build and run the base judge
        id: verdict
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/judge-target
        run: |
          repo="${RUNNER_TEMP}/judge.git"
          src="${RUNNER_TEMP}/judge-src"
          log="${RUNNER_TEMP}/judge.log"
          url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git init -q --bare "${repo}"
          git -C "${repo}" fetch -q --no-tags "${url}" \
            "${PR_BASE_SHA}:refs/heads/main" "refs/pull/${PR_NUMBER}/head:refs/judge/head"
          if [[ "$(git -C "${repo}" rev-parse refs/judge/head)" != "${PR_HEAD_SHA}" ]]; then
            echo "The pull request head changed before fetch." >&2
            exit 1
          fi
          mkdir "${src}"
          git -C "${repo}" archive "${PR_BASE_SHA}" | tar -x -C "${src}"
          (cd "${src}" && cargo build --locked --release)

          code=0
          (cd "${repo}" && "${CARGO_TARGET_DIR}/release/blackhole" ci --base "${PR_BASE_SHA}" \
            --head "${PR_HEAD_SHA}") > "${log}" 2>&1 || code=$?
          # Paths in diagnostics can resemble workflow commands.
          marker="$(cat /proc/sys/kernel/random/uuid)"
          printf '::stop-commands::%s\n' "${marker}"
          cat "${log}"
          printf '\n::%s::\n' "${marker}"
          case "${code}" in
            0) conclusion=success ;;
            1) conclusion=failure ;;
            *) exit "${code}" ;;
          esac
          printf 'conclusion=%s\n' "${conclusion}" >> "${GITHUB_OUTPUT}"

  publish:
    if: >-
      always() && github.repository == 'gaspardip/blackhole' &&
      (github.event.action != 'edited' || github.event.changes.base)
    needs: judge
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pull-requests: read
    steps:
      - name: Fetch the base publisher
        run: |
          repo="${RUNNER_TEMP}/publisher.git"
          git init -q --bare "${repo}"
          git -C "${repo}" fetch -q --depth 1 --no-tags \
            "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git" "${PR_BASE_SHA}"
          git -C "${repo}" show "${PR_BASE_SHA}:tools/judge_app.py" > "${RUNNER_TEMP}/judge_app.py"
      - name: Publish the App check run
        env:
          JUDGE_APP_ID: ${{ secrets.JUDGE_APP_ID }}
          JUDGE_APP_PRIVATE_KEY: ${{ secrets.JUDGE_APP_PRIVATE_KEY }}
          PR_READ_TOKEN: ${{ github.token }}
          JUDGE_RESULT: ${{ needs.judge.result }}
          JUDGE_CONCLUSION: ${{ needs.judge.outputs.conclusion }}
        run: python3 -I "${RUNNER_TEMP}/judge_app.py"
