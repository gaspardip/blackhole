name: judge

on:
  pull_request_target:
    # edited covers a change of base branch, which changes the judge and the policy it reads.
    types: [opened, reopened, synchronize, edited]

permissions:
  contents: read
  pull-requests: read

jobs:
  judge:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PR_AUTHOR: ${{ github.event.pull_request.user.login }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: judge
        run: |
          set -eu
          git init -q repo
          cd repo
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          # The judge is built from the base branch. The head arrives as git objects and is never checked out or run.
          git fetch -q origin "${GITHUB_SHA}" "+refs/pull/${PR_NUMBER}/head:refs/remotes/pr/head"
          git checkout -q "${GITHUB_SHA}"
          cargo build --locked --release --quiet
          raw="${RUNNER_TEMP}/reviews.json"
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/reviews" > "${raw}"
          permissions="${RUNNER_TEMP}/permissions.json"
          echo '{}' > "${permissions}"
          # Only an approval needs its reviewer's permission. A failed lookup counts as no access.
          jq -r '[.[][] | select(.state == "APPROVED") | .user.login // empty] | unique | .[]' "${raw}" |
            while IFS= read -r login; do
              level="$(gh api "repos/${GITHUB_REPOSITORY}/collaborators/${login}/permission" --jq .permission || echo none)"
              jq --arg login "${login}" --arg level "${level}" '. + {($login): $level}' "${permissions}" > "${permissions}.next"
              mv "${permissions}.next" "${permissions}"
            done
          commits="${RUNNER_TEMP}/commits.json"
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/commits" > "${commits}"
          approvals="${RUNNER_TEMP}/approvals.json"
          # Whoever wrote or committed a commit cannot be the one who approves it.
          jq --arg author "${PR_AUTHOR}" --slurpfile levels "${permissions}" --slurpfile commits "${commits}" '{
            authors: ([$author] + [$commits[0][][] | .author.login, .committer.login | select(. != null)] | unique),
            reviews: [.[][] | (.user.login // "") as $login | {
              login: $login,
              state: .state,
              commit: (.commit_id // ""),
              permission: ($levels[0][$login] // "none")
            }]
          }' "${raw}" > "${approvals}"
          target/release/blackhole ci --base "${GITHUB_SHA}" --head "${HEAD_SHA}" --approvals "${approvals}"
