name: name guard

on:
  push:
  pull_request_target:
    types: [opened, edited, reopened, synchronize]
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created, edited]
  release:
    types: [created, edited, published]
  # See the schedule case in tools/name_guard.py.
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  name-guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      BLACKHOLE_BANNED: ${{ secrets.BANNED_NAMES }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - name: scan
        run: |
          set -eu
          setup_failed() {
            echo "name guard cannot run: git setup failed" >&2
            exit 2
          }
          git init -q repo >/dev/null 2>&1 || setup_failed
          cd repo 2>/dev/null || setup_failed
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git" >/dev/null 2>&1 || setup_failed
          git fetch -q origin "+refs/heads/*:refs/remotes/origin/*" "+refs/tags/*:refs/tags/*" >/dev/null 2>&1 || setup_failed
          if [ -n "${PR_NUMBER}" ]; then
            git fetch -q origin "+refs/pull/${PR_NUMBER}/head:refs/remotes/pr/head" >/dev/null 2>&1 || setup_failed
          fi
          # An origin/HEAD alias can shadow a branch from the fetched namespace.
          remote_head="$(git ls-remote --symref origin HEAD 2>/dev/null)" || setup_failed
          tab="$(printf '\t')"
          default_ref="$(printf '%s\n' "${remote_head}" | sed -n "s|^ref: \(refs/heads/.*\)${tab}HEAD\$|\1|p")"
          git check-ref-format "${default_ref}" >/dev/null 2>&1 || setup_failed
          guard="${RUNNER_TEMP}/name_guard.py"
          git show "refs/remotes/origin/${default_ref#refs/heads/}:tools/name_guard.py" 2>/dev/null > "${guard}" || setup_failed
          # The guard reads the event file itself and decides whose text to scan. Event text
          # passed through `env:` would be printed in this public log before the guard ran.
          python3 -I "${guard}" event
