name: name guard

on:
  push:
  pull_request_target:
    types: [opened, edited, reopened, synchronize]
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created, edited]
  release:
    types: [created, edited, published]
  # Rescans every ref: GitHub sends no push event for a tag pushed with more than two others.
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  name-guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      BLACKHOLE_BANNED: ${{ secrets.BANNED_NAMES }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - name: scan
        run: |
          set -eu
          git init -q repo
          cd repo
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git fetch -q origin "+refs/heads/*:refs/remotes/origin/*" "+refs/tags/*:refs/tags/*"
          if [ -n "${PR_NUMBER}" ]; then
            git fetch -q origin "+refs/pull/${PR_NUMBER}/head:refs/remotes/pr/head"
          fi
          # The guard always comes from the default branch; the scanned refs are data.
          # The remote is asked which branch that is, because a scheduled event does not say.
          git remote set-head origin --auto > /dev/null
          guard="${RUNNER_TEMP}/name_guard.py"
          git show "origin/HEAD:tools/name_guard.py" > "${guard}"
          # The guard reads the event file itself and decides whose text to scan. Event text
          # passed through `env:` would be printed in this public log before the guard ran.
          python3 -I "${guard}" event
